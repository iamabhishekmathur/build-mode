name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - name: Agent files in sync and doctor clean, every example (FR-303)
        run: |
          for d in examples/ref-react-vite examples/ref-next-app examples/ref-vue-vite examples/ref-nuxt examples/ref-flags examples/multi-repo/acme-web; do
            (cd "$d" && node "$GITHUB_WORKSPACE/packages/cli/src/bin.ts" agents check && node "$GITHUB_WORKSPACE/packages/cli/src/bin.ts" doctor) || exit 1
          done
      - run: npx vitest run
