name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - name: Agent files in sync (FR-303)
        working-directory: examples/ref-react-vite
        run: node ../../packages/cli/src/bin.ts agents check
      - name: Doctor on the reference app
        working-directory: examples/ref-react-vite
        run: node ../../packages/cli/src/bin.ts doctor
      - name: Agent files in sync and doctor on the flags reference app (FR-403)
        working-directory: examples/ref-flags
        run: node ../../packages/cli/src/bin.ts agents check && node ../../packages/cli/src/bin.ts doctor
      - run: npx vitest run
